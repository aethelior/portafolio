<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anillo — prototipo v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Archivo:wght@400;500;600&family=Caveat:wght@500;600&family=Arapey&family=Homemade+Apple&family=DM+Mono:wght@400;500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBFAF5; --paper:#FBF7EE; --ink:#2b2320; --ink-soft:#6b5c52;
    --oxblood:#781C2B; --blush:#FFD8E0; --pale-yellow:#FFFAD2; --chocolate:#513F2B; --ice-blue:#EDFBFE;
    --line: rgba(43,35,32,0.14);
    --font-display:'Arapey', serif; --font-body:'DM Mono', monospace; --font-hand:'Homemade Apple', cursive;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background: var(--cream); color: var(--ink); font-family: var(--font-body); overflow:hidden; }
  .stage{ position:relative; width:100%; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .topline{ position:absolute; top:26px; left:30px; right:30px; z-index:6; display:flex; justify-content:space-between; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--ink-soft); pointer-events:none; }
  .hint{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-soft); opacity:0.75; z-index:6; text-align:center; transition: opacity 0.4s ease; }

  .ring-orbit{
    position:relative; width:620px; height:620px;
    transition: transform 0.12s linear;
  }
  .ring-spin{ position:absolute; inset:0; transition: transform 0.12s linear; }
  .orbit-item{ position:absolute; top:50%; left:50%; width:0; height:0; }
  .counter-spin{ transition: transform 0.12s linear; }
  .card{
    position:absolute; width:70px; height:92px; margin:-46px 0 0 -35px;
    border-radius:5px; box-shadow: 0 5px 12px rgba(34,30,27,0.2);
    border:1px solid rgba(255,255,255,0.3); cursor:pointer;
    background-size:contain; background-position:center; background-repeat:no-repeat; overflow:hidden;
  }
  .card::after{
    content:''; position:absolute; inset:0; border-radius:4px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }
  .card.case{ border:2px solid rgba(255,255,255,0.75); box-shadow: 0 8px 18px rgba(34,30,27,0.32); }
  .card .open-label{
    position:absolute; bottom:6px; left:6px; right:6px; z-index:1;
    font-size:8px; letter-spacing:0.05em; text-transform:uppercase; color:#fff;
    opacity:0; transition: opacity 0.3s ease;
  }
  .card.case .open-label{ opacity:1; }

  .center-name{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:3; opacity:0; transition: opacity 1s ease 0.2s; cursor:pointer;
  }
  .center-name.show{ opacity:1; }
  .center-name.hide-zoomed{ opacity:0; pointer-events:none; }
  .center-name .signature{ font-family: var(--font-hand); font-size:42px; color: var(--oxblood); line-height:1; }
  .center-name .role{ margin-top:6px; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); }
  .center-name .cta{ margin-top:10px; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-soft); opacity:0.7; }

  .deck-label{
    position:absolute; bottom:76px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:6; opacity:0; transition: opacity 0.5s ease; pointer-events:none;
  }
  .deck-label.show{ opacity:1; }
  .deck-label .num{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); }
  .deck-label .name{ font-family: var(--font-display); font-weight:500; font-style:italic; font-size:24px; color: var(--ink); margin-top:2px; }

  .scrim{ position:fixed; inset:0; background: rgba(242,238,228,0.4); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); opacity:0; pointer-events:none; transition: opacity 0.45s ease; z-index:10; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .window{ position:fixed; top:50%; left:50%; width:min(560px, 88vw); height:min(640px, 82vh); transform: translate(-50%,-50%) scale(0.92); background: var(--cream); border-radius:14px; box-shadow: 0 30px 70px rgba(34,30,27,0.35); opacity:0; pointer-events:none; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.22,.61,.36,1); z-index:20; overflow:hidden; display:flex; flex-direction:column; }
  .window.open{ opacity:1; pointer-events:auto; transform: translate(-50%,-50%) scale(1); }
  .window-close{ position:absolute; top:14px; right:14px; z-index:5; width:30px; height:30px; border-radius:50%; background: rgba(0,0,0,0.28); color:#fff; border:none; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .window-scroll{ overflow-y:auto; height:100%; }
  .window-hero{ height:260px; display:flex; align-items:flex-end; padding:26px; position:relative; }
  .window-hero::after{ content:''; position:absolute; inset:0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.4)); }
  .window-hero h2{ position:relative; z-index:2; font-family: var(--font-display); font-weight:500; font-size:30px; color:#fff; margin:0 0 4px; }
  .window-hero p{ position:relative; z-index:2; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color: rgba(255,255,255,0.85); margin:0; }
  .window-body{ padding:26px 30px 40px; }
  .window-body .kicker{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color: var(--oxblood); margin:0 0 6px; }
  .window-body p{ font-size:13.5px; line-height:1.65; color: var(--ink-soft); margin:0 0 24px; max-width:44ch; }
  .window-body section{ padding-top:20px; border-top:1px solid var(--line); margin-top:20px; }
  .window-body section:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .window-foot{ padding:24px 30px 44px; text-align:center; }
  .window-foot button{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; background:none; border:1px solid var(--line); color: var(--ink-soft); padding:10px 20px; border-radius:30px; cursor:pointer; }

  /* === Estilos del ticket de Cookiedugies (scopeados a .roll) === */
  .roll{
    --blush:#FFD8E0;
    --oxblood:#781C2B;
    --pale-yellow:#FFFAD2;
    --chocolate:#513F2B;
    --ice-blue:#EDFBFE;
    --cream:#F7F2E9;
    --paper:#FBF7EE;
    --ink:#2b2320;

    --font-display: 'Arapey', serif;
    --font-hand: 'Homemade Apple', cursive;
    --font-mono: 'DM Mono', monospace;
  }

  .roll *{box-sizing:border-box;}
    

  .roll{
    width: 100%;
    max-width: 760px;
    position: relative;
  }

  .roll-label{
    text-align:left;
    color: var(--oxblood);
    font-family: var(--font-mono);
    letter-spacing: 0.2em;
    font-size: 9.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.75;
  }

  /* ---- ticket stub ---- */
  .stub{
    background: var(--paper);
    position: relative;
    padding: 46px 54px;
    margin-bottom: 2px;
  }

  .stub::before, .stub::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width: 34px;
    background-image: radial-gradient(circle 6px, var(--chocolate) 6px, transparent 6.5px);
    background-repeat: repeat-y;
    background-position: center;
    background-size: 34px 26px;
  }
  .stub::before{ left:0; }
  .stub::after{ right:0; }

  .stub-inner{
    padding: 0 26px;
  }

  /* perforation between stubs */
  .perf{
    height: 0;
    border-top: 2px dashed rgba(81,63,43,0.35);
    position: relative;
    margin: 0 34px;
  }
  .perf::before{
    content: "✂";
    position:absolute;
    left: -6px;
    top: -9px;
    font-size: 12px;
    color: var(--chocolate);
    background: var(--chocolate);
    background: transparent;
    opacity:.5;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--oxblood);
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom: 1px solid rgba(81,63,43,0.25);
    padding-bottom: 10px;
    margin-bottom: 22px;
  }
  .eyebrow span:last-child{
    padding: 3px 9px;
    border-radius: 2px;
    font-size: 9.5px;
    letter-spacing: 0.1em;
  }

  .field-row{
    display:flex;
    gap: 24px;
    font-size: 12.5px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .field{
    flex:1;
    min-width: 140px;
  }
  .field-label{
    text-transform:uppercase;
    letter-spacing:0.12em;
    color: var(--oxblood);
    font-size: 10.5px;
    display:block;
    margin-bottom: 4px;
  }
  .field-value{
    font-size: 13px;
    line-height:1.5;
  }
  .placeholder{
    color: rgba(81,63,43,0.45);
    font-style: italic;
  }

  /* HERO */
  .hero-name{
    font-family: var(--font-hand);
    font-size: 64px;
    color: var(--oxblood);
    line-height: 1.15;
    margin: 4px 0 10px;
  }
  .hero-sub{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 20px;
    color: var(--chocolate);
    margin-bottom: 4px;
  }
  .hero-tagline{
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--ink);
    max-width: 480px;
    margin-bottom: 26px;
  }

  .collage{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    margin-top: 10px;
  }
  .collage img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border: 1px solid rgba(81,63,43,0.25);
    filter: sepia(8%) saturate(92%);
  }
  .collage .big{ grid-row: 1 / 4; aspect-ratio: 3/4; }
  .collage .small{ aspect-ratio: 4/3; }
  .collage.pair{ grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
  .collage.pair img{ grid-row: auto; aspect-ratio: 3/4; }
  .hero-wide{ margin-top:10px; }
  .hero-wide img{
    width:100%;
    aspect-ratio: 16/9;
    object-fit:cover;
    display:block;
    border: 1px solid rgba(81,63,43,0.25);
    filter: sepia(8%) saturate(92%);
  }

  .handnote{
    font-family: var(--font-hand);
    font-size: 22px;
    color: var(--oxblood);
    transform: rotate(-3deg);
    display:inline-block;
    margin-top: 14px;
  }

  /* stamp */
  .stamp{
    position:absolute;
    top: 40px;
    right: 54px;
    width: 84px;
    height: 84px;
    border: 2px solid var(--oxblood);
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: var(--oxblood);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: rotate(8deg);
    opacity: 0.85;
    line-height: 1.3;
    padding: 6px;
  }

  /* CHALLENGE */
  .split{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .split .field-label{ margin-bottom: 8px; }
  .split p{ font-size: 12.5px; line-height:1.6; margin:0; font-family: var(--font-mono); }
  .divider-v{
    width:1px;
    background: rgba(81,63,43,0.25);
  }

  /* MOODBOARD */
  .swatches{
    display:flex;
    gap: 16px;
    margin: 10px 0 30px;
    flex-wrap: wrap;
  }
  .swatch-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    width: 72px;
  }
  .swatch{
    width: 56px;
    height: 46px;
    border: 1px solid rgba(81,63,43,0.3);
  }
  .swatch-item span{
    margin-top: 7px;
    font-size: 8.5px;
    line-height: 1.25;
    text-align: center;
    font-family: var(--font-mono);
    color: var(--chocolate);
  }
  .type-sample{
    display:flex;
    gap: 30px;
    margin: 24px 0;
  }
  .type-sample div{ font-size:11px; color:var(--oxblood); text-transform:uppercase; letter-spacing:0.1em;}
  .type-sample .qs{ font-family: 'Quicksand', sans-serif; font-weight:700; font-size: 22px; color:var(--ink); text-transform:none; letter-spacing:0; margin-top:6px;}
  .type-sample .ts{ font-family: var(--font-hand); font-size: 26px; color:var(--ink); text-transform:none; letter-spacing:0; margin-top:6px;}

  /* PROCESS */
  .roadmap{
    list-style:none;
    padding:0;
    margin: 12px 0 0;
  }
  .roadmap li{
    display:flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px dashed rgba(81,63,43,0.25);
    align-items:flex-start;
  }
  .roadmap li:last-child{ border-bottom:none; }
  .check{
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--oxblood);
    flex-shrink:0;
    margin-top: 3px;
    position:relative;
  }
  .check::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 11px;
    color: var(--oxblood);
  }
  .stage-name{
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color: var(--oxblood);
    margin-bottom: 3px;
    font-family: var(--font-mono);
  }
  .stage-desc{ font-size:12.5px; line-height:1.55; }
  .stage-thumbs{
    display:flex;
    flex-wrap: wrap;
    gap:8px;
    margin-top: 10px;
  }
  .stage-thumbs img{
    width: 180px;
    height: 180px;
    object-fit: cover;
    border: 1px solid rgba(81,63,43,0.3);
    filter: sepia(8%);
  }
  .stage-thumbs.wide{
    flex-direction: column;
  }
  .stage-thumbs.wide img{
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
  }

  /* SOLUTION */
  .solution-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 16px;
  }
  .solution-grid img{
    width:100%;
    aspect-ratio: 4/5;
    object-fit:cover;
    border: 1px solid rgba(81,63,43,0.3);
    filter: sepia(8%);
  }
  .solution-grid.wide{
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .solution-grid.wide img{
    aspect-ratio: 16/9;
  }
  .solution-grid.wide .solution-caption{
    text-align:left;
    margin-top:8px;
    margin-bottom: 4px;
  }
  .solution-caption{
    font-size: 10.5px;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--oxblood);
    margin-top: 6px;
  }

  /* GALLERY */
  .gallery-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .gallery-grid img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border: 1px solid rgba(81,63,43,0.3);
    filter: sepia(8%);
  }
  .gallery-grid.wide{
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .gallery-grid.wide img{
    aspect-ratio: 16/9;
  }
  .video-highlight{
    margin: 18px auto 0;
    max-width: 240px;
  }
  .video-highlight video{
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    display: block;
    border: 1px solid rgba(81,63,43,0.3);
    filter: sepia(8%);
  }
  .video-highlight-caption{
    font-size: 10.5px;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--oxblood);
    margin-top: 8px;
  }
  .video-highlight.wide{
    max-width: 100%;
  }
  .video-highlight.wide video{
    aspect-ratio: 4/3;
  }
  .moodboard-footnote{
    font-size: 10px;
    line-height:1.5;
    color: var(--oxblood);
    opacity:0.75;
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1px dotted rgba(81,63,43,0.3);
  }

  /* IMPACT */
  .impact-list{
    margin: 14px 0 0;
    padding:0;
    list-style:none;
  }
  .impact-list li{
    padding: 10px 0;
    border-bottom: 1px dotted rgba(81,63,43,0.3);
    font-size: 12.5px;
    display:flex;
    gap: 16px;
  }
  .impact-list li:last-child{border-bottom:none;}
  .impact-list b{
    font-family: var(--font-mono);
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.1em;
    color:var(--oxblood);
    min-width: 120px;
    flex-shrink:0;
  }

  .folio{
    text-align:right;
    font-size:10px;
    color: rgba(81,63,43,0.5);
    margin-top: 30px;
  }

  .end-cut{
    text-align:center;
    color: var(--pale-yellow);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 18px;
    opacity:0.6;
  }

  @media (max-width: 640px){
    .stub{ padding: 36px 20px; }
    .stub-inner{ padding: 0 12px; }
    .hero-name{ font-size: 44px; }
    .collage{ grid-template-columns: 1fr 1fr; }
    .split{ grid-template-columns: 1fr; }
    .gallery-grid{ grid-template-columns: repeat(3,1fr); }
    .stamp{ position:static; margin-bottom:16px; transform:none; }
  }


  /* --- Integración del ticket (Cookiedugies) dentro de la ventana --- */
  .window.window-ticket{ max-width: 820px; width: min(820px, 92vw); background: transparent; box-shadow: none; border-radius: 0; overflow: visible; }
  .window.window-ticket .window-hero{ display:none; }
  .window.window-ticket .window-body{ padding: 28px 0 40px; }
  .window.window-ticket .roll{ max-width: 100%; padding: 0 6px; filter: drop-shadow(0 25px 50px rgba(0,0,0,0.4)); }
  .window.window-ticket .window-close{ background: rgba(0,0,0,0.45); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="topline">
    <span>Amanda Camacho — Portafolio</span>
    <span id="hintCount">Anillo completo</span>
  </div>

  <div class="ring-orbit" id="ringOrbit">
    <div class="ring-spin" id="ringSpin"></div>
    <div class="center-name" id="centerName">
      <div class="signature">Amanda Camacho</div>
      <div class="role">Digital Creative</div>
      <div class="cta">Clic — about me</div>
    </div>
    <div class="deck-label" id="deckLabel">
      <div class="num"></div>
      <div class="name"></div>
    </div>
  </div>

  <div class="hint" id="scrollHint">Scroll para acercarte al anillo · clic directo en una tarjeta para saltar ahí</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="window" id="window">
  <button class="window-close" id="closeBtn" aria-label="Cerrar">✕</button>
  <div class="window-scroll" id="windowScroll">
    <div class="window-hero" id="windowHero"><div><h2 id="windowTitle"></h2><p id="windowSubtitle"></p></div></div>
    <div class="window-body" id="windowBody"></div>
    <div class="window-foot"><button id="backToTop">Volver al anillo ↺</button></div>
  </div>
</div>

<script>
const cookiedugiesTicketHTML = `
<div class="roll">

  <!-- HERO -->
  <div class="stub">
    <div class="stub-inner">
      <div class="roll-label">— folio 001 · archivo de proyectos de Amanda Camacho —</div>
      <div class="eyebrow"><span>Case Study</span><span style="background:#781C2B;color:#FBF7EE;">Branding · 001</span></div>
      <div class="hero-name">Cookiedugies</div>
      <div class="hero-sub">Branding / Brand Experience</div>
      <div class="hero-tagline">Nostalgia horneada, amor a primera vista.</div>
      <div class="collage pair">
        <img src="images/hero-cookiedugies-1.jpeg" alt="Cookiedugies">
        <img src="images/hero-cookiedugies-2.jpeg" alt="Cookiedugies">
      </div>
      <div class="handnote">— Dugie dice hola :)</div>
      <div class="folio">folio 001 / 08</div>
    </div>
  </div>

  <div class="perf"></div>

  <!-- OVERVIEW -->
  <div class="stub">
    <div class="stub-inner">
      <div class="eyebrow"><span>Overview</span><span style="background:#FFD8E0;color:#513F2B;">folio 002</span></div>
      <div class="field-row">
        <div class="field">
          <span class="field-label">Qué</span>
          <span class="field-value">Marca de galletas artesanales con un empaque-experiencia: un mini horno de juguete del que literalmente "se hornea" y saca la galleta.</span>
        </div>
      </div>
      <div class="field-row">

const TOTAL = 30; // 6 proyectos × 5 tarjetas
const R = 250;
const anglePerCard = 360/TOTAL;
const ringSpin = document.getElementById('ringSpin');
const cardEls = [];

for(let i=0;i<TOTAL;i++){
  const angle = i*anglePerCard;
  const groupIndex = Math.floor(i/5);
  const posInGroup = i%5;
  const isCase = posInGroup===2;
  const deck = decks[groupIndex];
  const tilt = [-8,5,-4,9,-6][posInGroup];

  const item = document.createElement('div');
  item.className='orbit-item';
  item.style.transform = `rotate(${angle}deg) translate(${R}px)`;

  const counter = document.createElement('div');
  counter.className='counter-spin';
  counter.style.transform = `rotate(${-angle}deg)`;

  const card = document.createElement('div');
  card.className = 'card' + (isCase ? ' case':'');
  card.style.background = deck.color; // color de respaldo mientras carga o si falta la foto
  card.style.backgroundImage = `url('${deck.images[posInGroup]}')`;
  card.style.transform = `rotate(${tilt}deg)`;
  card.dataset.group = groupIndex;
  card.dataset.case = isCase ? '1':'0';
  if(isCase){ card.innerHTML = `<span class="open-label">Case study →</span>`; }

  counter.appendChild(card);
  item.appendChild(counter);
  ringSpin.appendChild(item);
  cardEls.push({el:card, counter, angle, groupIndex, isCase});
}

const ringOrbit = document.getElementById('ringOrbit');
const scrollHint = document.getElementById('scrollHint');
const hintCount = document.getElementById('hintCount');
const stage = document.getElementById('stage');
const scrim = document.getElementById('scrim');
const win = document.getElementById('window');
const windowScroll = document.getElementById('windowScroll');
const windowTitle = document.getElementById('windowTitle');
const windowSubtitle = document.getElementById('windowSubtitle');
const windowHero = document.getElementById('windowHero');
const windowBody = document.getElementById('windowBody');
const closeBtn = document.getElementById('closeBtn');
const backToTop = document.getElementById('backToTop');
const centerName = document.getElementById('centerName');
const deckLabel = document.getElementById('deckLabel');

let depth = 0; // 0 = anillo completo, 1 = zoom máximo (deck a la vista)
let zoomed = false;
let currentGroup = 0;
let n = 0; // contador continuo (no se resetea) — permite loop infinito real: proyecto activo = n mod decks.length
let windowOpen = false;
let introDone = false;
let navLocked = false; // evita que un solo gesto de scroll dispare varios saltos seguidos
function lockNavBriefly(){ navLocked = true; setTimeout(()=>{ navLocked = false; }, 780); }
const ZOOM_SCALE = 2.7;
const FRAME_Y = -60;
const ZOOM_TY = FRAME_Y/ZOOM_SCALE + R;

function groupCenterAngle(g){ return (g*5+2)*anglePerCard; }

function setRingRotation(deg){
  ringSpin.style.transform = `rotate(${deg}deg)`;
  cardEls.forEach(c=> c.counter.style.transform = `rotate(${-deg-c.angle}deg)`);
}

function setSpeed(mode){
  const t = mode==='fast' ? 'transform 0.08s linear' : 'transform 0.75s cubic-bezier(.22,.61,.36,1)';
  ringOrbit.style.transition = t;
  ringSpin.style.transition = t;
  cardEls.forEach(c=> c.counter.style.transition = t);
}

function render(){
  const scale = 1 + depth*(ZOOM_SCALE-1);
  const ty = depth*ZOOM_TY;
  ringOrbit.style.transform = `scale(${scale}) translate(0px, ${ty}px)`;
  const rot = depth * (-90 - groupCenterAngle(n)); // usa n SIN módulo -> el ángulo siempre crece, nunca "regresa"
  setRingRotation(rot);

  // ya no se ocultan las tarjetas de los proyectos vecinos: se quedan visibles,
  // es el zoom + la rotación del anillo lo que las empuja fuera de encuadre de forma natural
  const isZoomedIn = depth > 0.55;
  cardEls.forEach(c=>{
    c.el.style.opacity = '1';
    c.el.style.pointerEvents = 'auto';
  });

  centerName.classList.toggle('hide-zoomed', depth>0.05);
  deckLabel.classList.toggle('show', isZoomedIn);
  scrollHint.style.opacity = depth>0.1 ? '0' : '0.75';
  if(isZoomedIn){
    deckLabel.querySelector('.num').textContent = `Proyecto ${currentGroup+1} de ${decks.length}`;
    deckLabel.querySelector('.name').textContent = decks[currentGroup].name;
    hintCount.textContent = `Proyecto ${currentGroup+1} — ${decks[currentGroup].name} — ${decks[currentGroup].tag}`;
  } else {
    hintCount.textContent = 'Anillo completo';
  }
}

function goToGroup(g){
  setSpeed('smooth');
  currentGroup = ((g % decks.length) + decks.length) % decks.length;
  n = currentGroup; // reinicia el contador de loop desde aquí
  depth = 1; zoomed = true;
  render();
}
function exitZoom(){ zoomed = false; depth = 0; n = 0; setSpeed('smooth'); render(); }

cardEls.forEach(({el,groupIndex,isCase})=>{
  el.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(windowOpen || !introDone) return;
    if(zoomed && currentGroup===groupIndex && isCase){
      openWindow(decks[groupIndex]);
    } else {
      goToGroup(groupIndex);
    }
  });
});

stage.addEventListener('wheel', (e)=>{
  if(windowOpen || !introDone) return;
  e.preventDefault();
  if(navLocked) return;

  const down = e.deltaY > 0;
  const up = e.deltaY < 0;
  if(!down && !up) return;

  if(!zoomed){
    // scroll abajo desde el anillo completo -> salto directo al zoom máximo (proyecto 0)
    if(down){
      lockNavBriefly();
      setSpeed('smooth');
      currentGroup = 0;
      n = 0;
      zoomed = true;
      depth = 1;
      render();
    }
    // scroll arriba ya sin zoom: no-op
    return;
  }

  // ya está en zoom máximo: cada gesto avanza/retrocede UN proyecto completo
  lockNavBriefly();
  setSpeed('smooth');
  if(down){
    n += 1; // nunca se resetea -> loop infinito real
    currentGroup = ((n % decks.length) + decks.length) % decks.length;
    render();
  } else {
    if(n > 0){
      n -= 1;
      currentGroup = ((n % decks.length) + decks.length) % decks.length;
      render();
    } else {
      zoomed = false;
      depth = 0;
      n = 0;
      render();
    }
  }
}, {passive:false});

function openWindow(d){
  windowOpen = true;
  if(d.id === 'cookiedugies'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = cookiedugiesTicketHTML;
  } else if(d.id === 'luzviva'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = luzvivaTicketHTML;
  } else if(d.id === 'sequence'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = sequenceTicketHTML;
  } else if(d.id === 'thecoffee'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = thecoffeeTicketHTML;
  } else if(d.id === 'secretaria'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = secretariaTicketHTML;
  } else if(d.id === 'kiddos'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = kiddosTicketHTML;
  } else if(d.id === 'aboutme'){
    win.classList.add('window-ticket');
    windowTitle.textContent = '';
    windowSubtitle.textContent = '';
    windowBody.innerHTML = aboutMeTicketHTML;
  } else {
    win.classList.remove('window-ticket');
    windowTitle.textContent = d.name;
    windowSubtitle.textContent = d.tag;
    windowHero.style.background = d.color;
    windowBody.innerHTML = d.sections.map(([k,v])=>`<section><p class="kicker">${k}</p><p>${v}</p></section>`).join('');
  }
  windowScroll.scrollTop = 0;
  scrim.classList.add('open');
  win.classList.add('open');
}
function closeWindow(){ windowOpen = false; scrim.classList.remove('open'); win.classList.remove('open'); }
closeBtn.addEventListener('click', closeWindow);
backToTop.addEventListener('click', closeWindow);
scrim.addEventListener('click', closeWindow);
centerName.addEventListener('click', ()=>{ if(!zoomed) openWindow(aboutMe); });

let overscroll = 0;
windowScroll.addEventListener('wheel', (e)=>{
  if(windowScroll.scrollTop <= 0 && e.deltaY < 0){
    overscroll += Math.abs(e.deltaY);
    if(overscroll > 140){ closeWindow(); overscroll = 0; }
  } else { overscroll = 0; }
});

// --- Intro: motor por requestAnimationFrame con easeOutExpo (del prototipo original) ---
// reparte el giro en toda la duración en vez de concentrarlo al inicio y quedarse quieto el resto.
function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

ringOrbit.style.transform = 'scale(1) translate(0px,0px)';
ringSpin.style.transition = '';
cardEls.forEach(c=> c.counter.style.transition = '');

const INTRO_FROM = 900;
const INTRO_TO = 0;
const INTRO_DURATION = 2600;
let introStart = null;

function introTick(ts){
  if(introStart === null) introStart = ts;
  const t = Math.min(1, (ts - introStart) / INTRO_DURATION);
  const e = easeOutExpo(t);
  setRingRotation(INTRO_FROM + (INTRO_TO - INTRO_FROM) * e);
  if(t < 1){
    requestAnimationFrame(introTick);
  } else {
    centerName.classList.add('show');
    introDone = true;
  }
}
requestAnimationFrame(introTick);
</script>
